name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SpeedAlert.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedAlert-apk
          path: SpeedAlert.apk

      # Publishes the APK on the repo's Releases page so you can
      # download it straight from your phone's browser.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" SpeedAlert.apk \
            --title "Speed Alert build ${{ github.run_number }}" \
            --notes "Download SpeedAlert.apk below and open it on your phone to install." \
            --latest
